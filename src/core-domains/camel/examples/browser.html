<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camel + Nexus browser session</title>
<style>
body {font: 16px/1.5 system-ui; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #182238; background: #f6f8ff}
button {font: inherit; padding: .5rem 1rem; margin: .25rem; border: 1px solid #99a6c5; border-radius: .5rem; background: white}
pre {padding: 1rem; white-space: pre-wrap; background: #17213a; color: #e0eaff; border-radius: .6rem; min-height: 12rem}
</style>
<h1>Camel running inside WebAssembly</h1>
<p>One Rust interpreter session keeps its counter between inputs. Each input waits for a committed Nexus tick, then creates a ledger in the same installed Data domain. Press → or “Add input”.</p>
<button id="start">Start / restart</button><button id="input" disabled>Add input</button><button id="stop" disabled>Cancel</button>
<p id="status">Idle. No runtime or model is downloaded from a third-party service.</p>
<pre id="output"></pre>
<script type="importmap">
{"imports":{"nexusengine/engine":"../../../engine.js","nexusengine/domains/runtime/data":"../../runtime/data/kits/data-kit/index.js","nexusengine/domains/camel":"../index.js"}}
</script>
<script type="module">
import {createEngine} from 'nexusengine/engine';
import {createDataKit} from 'nexusengine/domains/runtime/data';
import {createCamelDomain} from 'nexusengine/domains/camel';
const output = document.querySelector('#output'), status = document.querySelector('#status');
const logs = [];
const engine = createEngine({kits: [createDataKit(), ...createCamelDomain({runtime: 'browser', sessionSteps: 1000000, allowCalls: ['data.completion.createLedger:call'], onLog: message => {logs.push(message); render();}})]});
const camel = engine.n.camel;
let session = null, generation = 0, frame;
const source = `
 tool object Input() { handler = "nexus.input"; }
 tool object Update() { handler = "nexus.update"; }
 tool any Call(string api, string[] path, any[] args) { handler = "nexus.call"; }
 workflow int Main(string prefix) {
   int total = 0;
   while (true) {
     object input = Input();
     object frame = Update();
     total += input.amount;
     Call("data", ["completion", "createLedger"], [prefix + string(total)]);
     log("Counter " + string(total) + " at Nexus frame " + string(frame.frame));
   }
   return total;
 }
`;
function render() {output.textContent = logs.slice(-12).join('\n') + '\n\nNexus Data ledgers:\n' + JSON.stringify(engine.n.data.completion.listLedgers(), null, 2);}
function controls() {document.querySelector('#input').disabled = !session; document.querySelector('#stop').disabled = !session;}
function cancel() {if (session) camel.stop(session.id); session = null; cancelAnimationFrame(frame); controls(); status.textContent = 'Cancelled. The suspended Rust stack was discarded; Data ledgers remain in Nexus.';}
function tick() {if (!session) return; engine.tick(1 / 60); frame = requestAnimationFrame(tick);}
document.querySelector('#start').onclick = () => {
  cancel(); logs.length = 0;
  const current = camel.start(source, {args: [`run-${++generation}-`]}); session = current;
  controls(); status.textContent = 'Running one persistent Rust session. Waiting for input…'; render(); frame = requestAnimationFrame(tick);
  camel.wait(current.id).catch(error => {
    if (session?.id !== current.id) return;
    status.textContent = error.message; session = null; cancelAnimationFrame(frame); controls();
  });
};
function input() {if (session) camel.input(session.id, {amount: 1});}
document.querySelector('#input').onclick = input;
document.querySelector('#stop').onclick = cancel;
window.addEventListener('keydown', event => {if (event.key === 'ArrowRight') {event.preventDefault(); input();}});
window.addEventListener('pagehide', () => {cancel(); camel.dispose();});
render();
</script>
</html>
