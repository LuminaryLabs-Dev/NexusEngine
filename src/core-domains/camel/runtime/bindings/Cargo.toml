[package]
name = "nexus-camel-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib"]
[dependencies]
camel-audio-runtime = { path = "../upstream/runtime" }
napi = { version = "2.16", default-features = false, features = ["napi8", "async"] }
napi-derive = "2.16"
serde_json = "1"
