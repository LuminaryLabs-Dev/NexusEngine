[package]
name = "nexus-camel-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib"]
[dependencies]
camel-audio-runtime = { path = "../upstream/runtime" }
serde_json = "1"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
