name: Finalize Semantic Core Domain Path Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-path-migration-finalize.yml'

permissions:
  contents: write

concurrency:
  group: semantic-core-domain-path-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Execute the already-validated migration gates verbatim
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const source = '.github/workflows/semantic-path-migration.yml';
          const lines = fs.readFileSync(source, 'utf8').split('\n');
          const wanted = [
            'Install validation dependencies',
            'Capture baseline validation matrix',
            'Phase 1 - mechanical move and verify',
            'Phase 2 - add isolated import sandbox and verify',
            'Phase 3 - repair only real physical path references',
            'Reconcile generated path metadata',
            'Import sandbox must be fully green',
            'Capture migrated validation matrix',
            'Final architecture regression gate'
          ];

          function extractRun(name) {
            const marker = `      - name: ${name}`;
            const start = lines.indexOf(marker);
            if (start < 0) throw new Error(`missing validated step: ${name}`);

            let runAt = -1;
            for (let i = start + 1; i < lines.length; i += 1) {
              if (lines[i].startsWith('      - ')) break;
              if (lines[i].startsWith('        run:')) {
                runAt = i;
                break;
              }
            }
            if (runAt < 0) throw new Error(`missing run command: ${name}`);

            const runLine = lines[runAt];
            if (runLine === '        run: |') {
              const body = [];
              for (let i = runAt + 1; i < lines.length; i += 1) {
                const line = lines[i];
                if (line === '') {
                  body.push('');
                  continue;
                }
                const indent = line.match(/^ */)?.[0].length ?? 0;
                if (indent <= 8) break;
                if (!line.startsWith('          ')) throw new Error(`unexpected indentation in ${name}: ${line}`);
                body.push(line.slice(10));
              }
              return body.join('\n');
            }

            const prefix = '        run: ';
            if (!runLine.startsWith(prefix)) throw new Error(`unsupported run syntax: ${name}`);
            return runLine.slice(prefix.length);
          }

          for (const name of wanted) {
            const script = extractRun(name);
            console.log(`\n===== ${name} =====`);
            const result = spawnSync('bash', ['-lc', script], {
              cwd: process.cwd(),
              env: process.env,
              stdio: 'inherit'
            });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE

      - name: Final pre-commit verification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find src/core-domains -type d -name subdomains -print -quit)"
          node tests/core-domains/core-domain-import-smoke.mjs
          npm run ownership:check
          npm run migrations:check
          git diff --check
          test "$(git diff -- .github/workflows/semantic-path-migration.yml .github/workflows/semantic-path-migration-finalize.yml | wc -l)" -eq 0
          echo "FINALIZER_PRECOMMIT_OK"

      - name: Commit validated migration directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+thecrimsondeveloper@users.noreply.github.com'
          if git diff --quiet HEAD -- && git diff --cached --quiet; then
            echo "No migration changes remain to commit."
            exit 0
          fi
          git status --short
          git commit -m 'refactor(core-domains): mirror semantic hierarchy in filesystem'
          git push origin HEAD:main
