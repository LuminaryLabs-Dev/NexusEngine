name: 0.0.5 Detection Portability Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/0.0.5-detection-portability-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fix optional continuous-collision defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core-domains/physics/subdomains/detection/detection-contracts.js')
          s = p.read_text()
          old = '''      tolerance: value.tolerance,
                maxIterations: value.maxIterations,
                metadata: value.metadata'''
          # Match the actual indentation while keeping the replacement narrow.
          old = '''      tolerance: value.tolerance,
      maxIterations: value.maxIterations,
      metadata: value.metadata'''
          new = '''      tolerance: value.tolerance ?? 1e-7,
      maxIterations: value.maxIterations ?? 32,
      metadata: value.metadata ?? {}'''
          if old not in s:
              raise SystemExit('continuous collision optional-field block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Direct five-package proof
        run: |
          node tests/core-domains/core-physics-body-smoke.mjs
          node tests/core-domains/core-physics-shape-smoke.mjs
          node tests/core-domains/core-physics-collider-smoke.mjs
          node tests/core-domains/core-physics-detection-smoke.mjs
          node tests/core-domains/core-render-surface-smoke.mjs
          node tests/core-domains/core-0.0.5-five-goal-public-surface-smoke.mjs
      - name: Backend boundary
        run: |
          ! grep -RInE 'RapierRigidBody|PhysX|THREE\.|HTMLCanvasElement|GPUCanvasContext|WebGLRenderingContext|GPUBuffer' \
            src/core-domains/physics/subdomains/body \
            src/core-domains/physics/subdomains/shape \
            src/core-domains/physics/subdomains/collider \
            src/core-domains/physics/subdomains/detection \
            src/core-domains/render/subdomains/surface
      - name: Diff integrity
        run: git diff --check
      - name: Commit portability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core-domains/physics/subdomains/detection/detection-contracts.js
          git commit -m "fix(0.0.5): preserve portable continuous collision defaults"
          git push origin HEAD:main
