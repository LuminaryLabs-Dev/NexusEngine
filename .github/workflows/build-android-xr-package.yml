name: Build Android XR Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusengine-android-xr-package-main
  cancel-in-progress: true

jobs:
  build-android-xr-package:
    name: Build Android XR Package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXUSENGINE_HOME: ${{ runner.temp }}/nexusengine

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: 8.10.2

      - name: Select installed Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          test -d "$sdk/platforms/android-35"
          test -d "$sdk/cmake/3.22.1"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Pin Rust and Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup target add aarch64-linux-android --toolchain 1.85.0

      - name: Install package metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and prove Android XR package
        run: node scripts/prove-native-package.mjs android-xr

      - name: Upload Android XR package proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexusengine-android-xr-package-proof
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/nexusengine/artifacts/
            ${{ runner.temp }}/nexusengine/ci-evidence/android-xr.json
          retention-days: 14
