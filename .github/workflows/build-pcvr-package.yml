name: Build PCVR Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusengine-pcvr-package-main
  cancel-in-progress: true

jobs:
  build-pcvr-package:
    name: Build PCVR Package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Configure NexusEngine state root
        shell: pwsh
        run: '"NEXUSENGINE_HOME=${{ runner.temp }}/nexusengine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Pin Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.85.0-x86_64-pc-windows-msvc

      - name: Install package metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and prove PCVR package
        run: node scripts/prove-native-package.mjs pcvr

      - name: Upload PCVR package proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nexusengine-pcvr-package-proof
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/nexusengine/artifacts/
            ${{ runner.temp }}/nexusengine/ci-evidence/pcvr.json
          retention-days: 14
