name: Validate Core Object Shape

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-object-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate input and output meshes
        run: |
          set -euo pipefail
          node tests/core-domains/core-object-shape-domain-smoke.mjs | tee object-shape-geometry.log

      - name: Validate capture visual output
        run: |
          set -euo pipefail
          node tests/core-domains/core-capture-shape-visual-smoke.mjs | tee object-shape-capture.log

      - name: Validate skinned qualification
        run: |
          set -euo pipefail
          node tests/core-domains/core-object-shape-skinned-qualification-smoke.mjs | tee object-shape-skinned-qualification.log

      - name: Upload geometry and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-object-shape-smoke-evidence
          if-no-files-found: error
          path: |
            object-shape-geometry.log
            object-shape-capture.log
            object-shape-skinned-qualification.log
            /tmp/nexus-object-shape-capture-*/source-vs-reduced.svg
          retention-days: 14
