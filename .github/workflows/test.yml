name: NexusEngine Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusengine-tests-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run core:check
      - run: npm run core:contracts
      - run: npm run ownership:generate
      - run: npm run protokits:check
      - run: npm run migrations:check
      - run: npm run release:manifest
      - run: git diff --exit-code
      - run: npm test
      - run: npm run test:release
      - run: npm run boundaries:check
      - run: npm run docs:check
      - run: npm pack --dry-run --json
