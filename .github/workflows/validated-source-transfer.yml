name: Validated Source Tree Transfer
on:
  push:
    branches: [main]
    paths: [.github/workflows/validated-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify approved source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,subprocess,urllib.request,pathlib,tempfile,time
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          base='093a86c8ee1f089d361acea0bff801cb47ea0658'
          expected_tree='1c28c80006d12310a34767ea24a785573300a852'
          expected_payload='8b778444941bcc0914f0baa5a5dc692dfe4be8f54c81546996bf56df5b9ac37a'
          parts=['1d7092d5fe461e77e6228b677b0e905d8711ed69','6f84f98d2fd3cfe1b718d822e46f37424d64080b','30e09d362e3aa34887141eafe5fee6df643489dd','490264fa853550658556804ea9f9509a2554d2bb']
          workflow='.github/workflows/validated-source-transfer.yml'
          assert repo=='LuminaryLabs-Dev/NexusEngine'
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          def api(endpoint,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=90) as response:return json.load(response)
          assert git('rev-parse','HEAD')==head
          assert git('rev-parse','HEAD^')==base,'Source base changed; do not overwrite concurrent work.'
          assert git('diff','--name-only',base,head)==workflow
          assert api('git/ref/heads/main')['object']['sha']==head
          payload=b''
          for sha in parts:
              value=api('git/blobs/'+sha);assert value['encoding']=='base64'
              part=base64.b64decode(value['content']);assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              payload+=part
          assert hashlib.sha256(payload).hexdigest()==expected_payload
          decoded=gzip.decompress(payload);assert len(decoded)<2000000
          spec=json.loads(decoded)
          assert spec['schema']=='nexus-source-transfer-zstd/1' and spec['repo']==repo and spec['base']==base and spec['tree']==expected_tree
          paths=spec['paths'];assert len(paths)==len(set(paths)) and len(paths)<500
          for p in paths:
              assert isinstance(p,str) and p and not p.startswith('/') and '\\' not in p and '\0' not in p and all(x not in ('','..','.git') for x in p.split('/')) and p!=workflow
          baseline=[]
          for p in paths:
              result=subprocess.run(['git','show',base+':'+p],capture_output=True)
              baseline.append({'path':p,'content':result.stdout.decode() if result.returncode==0 else ''})
          old=json.dumps(baseline,separators=(',',':'),ensure_ascii=True).encode()
          assert hashlib.sha256(old).hexdigest()==spec['baselineSha256']
          with tempfile.TemporaryDirectory() as directory:
              directory=pathlib.Path(directory);(directory/'old.json').write_bytes(old);(directory/'patch.zst').write_bytes(base64.b64decode(spec['patch'],validate=True))
              subprocess.run(['zstd','-q','-d','-f','--patch-from='+str(directory/'old.json'),str(directory/'patch.zst'),'-o',str(directory/'new.json')],check=True,timeout=60)
              raw=(directory/'new.json').read_bytes();assert len(raw)<16000000 and hashlib.sha256(raw).hexdigest()==spec['targetSha256']
              entries=json.loads(raw)
          assert [e['path'] for e in entries]==paths
          records=[];tree_entries=[]
          for entry in entries:
              assert set(entry)=={'path','mode','type','content'} and entry['type']=='blob' and entry['mode'] in ('100644','100755')
              data=entry['content'].encode();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              local=subprocess.run(['git','hash-object','-w','--stdin'],input=data,capture_output=True,check=True).stdout.decode().strip();assert local==sha
              subprocess.run(['git','update-index','--add','--cacheinfo',entry['mode']+','+sha+','+entry['path']],check=True)
              records.append({'path':entry['path'],'mode':entry['mode'],'sha':sha,'bytes':len(data)})
              if len(data)>100000:
                  result=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'});assert result['sha']==sha
                  tree_entries.append({'path':entry['path'],'mode':entry['mode'],'type':'blob','sha':sha});time.sleep(1)
              else:tree_entries.append(entry)
          subprocess.run(['git','update-index','--force-remove',workflow],check=True)
          assert git('write-tree')==expected_tree,'Reconstructed local tree differs from validated sandbox.'
          tree_entries.append({'path':workflow,'mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':tree_entries})
          assert tree['sha']==expected_tree
          assert api('git/ref/heads/main')['object']['sha']==head,'Concurrent work arrived; do not advance main.'
          receipt={'repository':repo,'sourceBase':base,'workflowHead':head,'tree':tree['sha'],'payloadSha256':expected_payload,'files':records,'mainUnchanged':True,'createsCommit':False,'updatesRef':False}
          pathlib.Path('transfer-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({k:v for k,v in receipt.items() if k!='files'},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-source-tree
          path: transfer-receipt.json
          if-no-files-found: error
          retention-days: 3
