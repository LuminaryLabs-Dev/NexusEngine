<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="ide-token" content="SESSION_TOKEN"><title>Nexus Code Workspace</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>NEXUS CODE WORKSPACE</strong><span id="status" role="status">Ready</span></header>
<nav aria-label="Development actions"><button id="new">New file</button><button id="open">Open file</button><button id="save">Save all</button><button id="reopen">Reopen session</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="diagnose">Diagnostics</button><button id="complete">Complete</button><button id="hover">Hover</button><button id="definition">Definition</button><button id="references">References</button><button id="symbols">Symbols</button><button id="format">Format</button><button id="build">Build snapshot</button><button id="run">Run output</button><button id="git">Git status</button><button id="debug" disabled title="A configured debugger provider is required">Debug</button></nav>
<main><aside><h2>Project</h2><input id="search" aria-label="Search code" placeholder="Search code"><div id="files"></div></aside><section class="editor"><div id="tabs" role="tablist" aria-label="Open code files"></div><label id="filename" for="source">Select a source file</label><textarea id="source" spellcheck="false" aria-label="Source code" disabled></textarea><p id="position">UTF-16 source offsets · edits commit through Authoring Project</p></section></main>
<section class="results"><h2>Diagnostics and development output</h2><pre id="output" aria-live="polite">Open or create a file to begin.</pre></section><script type="module" src="/client.mjs"></script></body></html>
